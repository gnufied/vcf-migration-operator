              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VolumeCopySpec identifies the source PVC whose data is migrated.
            properties:
              dataMigrationStrategy:
                description: |-
                  DataMigrationStrategy is the strategy VMO resolved for this PVC during Planning.
                  It is never Auto, and it is immutable so an in-flight copy never switches mechanism.
                enum:
                - Auto
                - Rsync
                type: string
                x-kubernetes-validations:
                - message: dataMigrationStrategy must be a resolved strategy, not
                    Auto
                  rule: self != 'Auto'
                - message: dataMigrationStrategy is immutable
                  rule: self == oldSelf
              sourcePVC:
                description: SourcePVC identifies the source PVC in this namespace.
                properties:
                  name:
                    description: Name is the object name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the identity of the object; same-name replacements
                      must not be adopted.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: sourcePVC is immutable
                  rule: self == oldSelf
              targetFailureDomain:
                description: |-
                  TargetFailureDomain is the resolved target failure domain, naming an entry in the
                  VmwareCloudFoundationMigration's spec.failureDomains.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: targetFailureDomain is immutable
                  rule: self == oldSelf
            required:
            - dataMigrationStrategy
            - sourcePVC
            - targetFailureDomain
            type: object
          status:
            description: VolumeCopyStatus contains operator-owned progress for one
